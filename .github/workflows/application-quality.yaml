name: application-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.16"
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.16"

      - name: Validate dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --no-install-project

      - name: Validate presentation policy
        run: .venv/bin/python -m json.tool configs/evidence_dashboard_policy.json >/dev/null

      - name: Compile application modules
        run: .venv/bin/python -m compileall -q dashboard

      - name: Run self-contained test suite
        run: .venv/bin/python -m pytest -q -m "not production_artifacts"

      - name: Build release container
        run: |
          policy_sha256="$(
            sha256sum configs/evidence_dashboard_policy.json \
              | cut -d' ' -f1
          )"

          docker build \
            --file Dockerfile.dashboard \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg EVIDENCE_POLICY_SHA256="$policy_sha256" \
            --tag battery-aging-evidence-dashboard:test \
            .

      - name: Verify release metadata
        run: |
          policy_sha256="$(
            sha256sum configs/evidence_dashboard_policy.json \
              | cut -d' ' -f1
          )"

          test "$(
            docker inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              battery-aging-evidence-dashboard:test
          )" = "$GITHUB_SHA"

          test "$(
            docker inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.evidence-policy-sha256" }}' \
              battery-aging-evidence-dashboard:test
          )" = "$policy_sha256"

      - name: Build synthetic runtime evidence
        run: |
          .venv/bin/python -m tests.evidence_dashboard_fixture \
            --output-directory "$RUNNER_TEMP/evidence-dashboard-fixture" \
            --policy-path configs/evidence_dashboard_policy.json

      - name: Start release container
        run: |
          docker run \
            --detach \
            --name evidence-dashboard \
            --publish 127.0.0.1:8501:8501 \
            --mount type=bind,source="$RUNNER_TEMP/evidence-dashboard-fixture/artifacts",target=/artifacts,readonly \
            --mount type=bind,source="$RUNNER_TEMP/evidence-dashboard-fixture/evidence_dashboard_policy.json",target=/app/configs/evidence_dashboard_policy.json,readonly \
            battery-aging-evidence-dashboard:test

      - name: Verify release-container readiness
        run: |
          for attempt in {1..60}; do
            container_health="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                evidence-dashboard
            )"

            if curl --fail --silent --show-error \
              http://127.0.0.1:8501/_stcore/health >/dev/null \
              && [ "$container_health" = "healthy" ]; then
              docker inspect \
                --format '{{json .State.Health}}' \
                evidence-dashboard
              exit 0
            fi

            sleep 1
          done

          docker inspect \
            --format '{{json .State.Health}}' \
            evidence-dashboard
          docker logs evidence-dashboard
          exit 1


      - name: Verify container renders every registered view
        run: |
          docker run --rm \
            --mount type=bind,source="$RUNNER_TEMP/evidence-dashboard-fixture/artifacts",target=/artifacts,readonly \
            --mount type=bind,source="$RUNNER_TEMP/evidence-dashboard-fixture/evidence_dashboard_policy.json",target=/app/configs/evidence_dashboard_policy.json,readonly \
            --entrypoint python \
            battery-aging-evidence-dashboard:test \
            -c "
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file('/app/dashboard/app.py')
          app.run(timeout=120)
          assert not app.exception, 'Initial render: ' + str(app.exception)
          for page in ['Evidence boundaries', 'Experimental support', 'Trajectories', 'Predictive evidence', 'Robustness', 'Provenance']:
              app.sidebar.radio[0].set_value(page)
              app.run(timeout=120)
              assert not app.exception, f'{page}: ' + str(app.exception)
          print('All views render.')
          "