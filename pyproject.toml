[project]
name = "adaptive-battery-aging-policy"
version = "0.1.0"
description = "Controlled analysis of lithium-ion battery degradation and operating policy."
requires-python = ">=3.11,<3.12"
dependencies = [
    "arviz>=0.23.4,<1.0",
    "google-cloud-storage>=3.14.1,<4.0",
    "google-cloud-storage-transfer>=1.21.0,<2.0",
    "numpy>=2.0,<3.0",
    "pymc>=5.28.2,<6.0",
    "scipy>=1.16,<2.0",
    "statsmodels>=0.15,<0.16",
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.9,<2.0"
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0"
]
dashboard = [
    "pandas>=3.1,<4.0",
    "streamlit>=1.67,<2.0"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
pythonpath = [
    "."
]
markers = [
    "production_artifacts: requires validated generated artifacts under data/processed"
]